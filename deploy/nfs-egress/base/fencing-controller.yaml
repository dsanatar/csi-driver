apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubevirt-nfs-fencing-controller
  namespace: kubevirt-csi-driver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubevirt-nfs-fencing-controller
  template:
    metadata:
      labels:
        app: kubevirt-nfs-fencing-controller
    spec:
      serviceAccount: kubevirt-nfs-fencing-sa
      priorityClassName: system-cluster-critical

      # Co-locate with the CSI controller on the control plane.
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: "NoSchedule"
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: "NoSchedule"

      containers:
        - name: fencing-controller
          image: 192.168.66.2:5000/nfs-fencing-controller:latest
          imagePullPolicy: Always
          args:
            - "--infra-cluster-kubeconfig=/var/run/secrets/infracluster/kubeconfig"
            - "--infra-cluster-namespace=$(INFRACLUSTER_NAMESPACE)"
            - "--infra-cluster-labels=$(INFRACLUSTER_LABELS)"
            # pvc-nfs-pool matches the name produced by CreateNFSPoolDV (prefix=pvc)
            - "--pool-dv-name=pvc-nfs-pool"
            - "--v=5"
          env:
            - name: INFRACLUSTER_NAMESPACE
              valueFrom:
                configMapKeyRef:
                  name: driver-config
                  key: infraClusterNamespace
            - name: INFRACLUSTER_LABELS
              valueFrom:
                configMapKeyRef:
                  name: driver-config
                  key: infraClusterLabels
          volumeMounts:
            - name: infracluster
              mountPath: /var/run/secrets/infracluster
          resources:
            requests:
              memory: 50Mi
              cpu: 10m

      volumes:
        - name: infracluster
          secret:
            # Reuse the same infra cluster credentials secret as the CSI controller.
            secretName: infra-cluster-credentials

apiVersion: v1
kind: ConfigMap
metadata:
  name: ganesha-config
  namespace: kubevirt-csi-driver
data:
  ganesha.conf: |
    NFS_Core_Param {
        NFS_Port = 2049;
        Protocols = 4;
        Transports = TCP;
    }

    NFSv4 {
        Minor_Versions = 1;
        Graceless = TRUE;
    }

    LOG {
        Default_Log_Level = EVENT;
    }

    %include /mnt/pool/.ganesha-state/exports.conf

apiVersion: v1
kind: ConfigMap
metadata:
  name: ganesha-config
  namespace: kubevirt-csi-driver
data:
  ganesha.conf: |
    NFS_CORE_PARAM {
        Clustered = TRUE;
        NFS_Port = 2049;
        Protocols = 4;
    }

    NFSv4 {
        RecoveryBackend = "fs";
        Grace_Period = 60;
    }

    LOG {
        Default_Log_Level = EVENT;
    }

    %include /mnt/pool/.ganesha-state/exports.conf

apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kubevirt-nfs-egress
  namespace: kubevirt-csi-driver
spec:
  selector:
    matchLabels:
      app: kubevirt-nfs-egress
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: kubevirt-nfs-egress
    spec:
      serviceAccount: kubevirt-nfs-egress-sa
      priorityClassName: system-node-critical

      # Required so the sidecar can send SIGHUP to the ganesha process.
      shareProcessNamespace: true

      # Fixed hostname so NFS-Ganesha presents a stable so_major_id across
      # failover. Without this, each pod gets a unique hostname, the NFSv4.1
      # client sees a different server identity after failover, and all
      # cached file handles go stale (ESTALE). A fixed hostname also makes
      # the default Node_Base stable, so recovery records written by the old
      # server are found by the new one during the grace period.
      hostname: nfs-ganesha

      # Only schedule on the node labelled as the NFS server.
      # The fencing controller is responsible for moving this label to a
      # healthy node and hotplugging the pool DV there during failover.
      nodeSelector:
        csi.kubevirt.io/nfs-server: "true"

      tolerations:
        - operator: Exists

      # The init container guarantees the pool block device is mounted and the
      # ganesha state directory structure exists before any main container starts.
      # It uses standard Linux storage tools (util-linux, xfsprogs) — no custom
      # binary required.
      initContainers:
        - name: pool-setup
          # Requires: lsblk, blkid, mkfs.xfs (xfsprogs), mount, sed, awk.
          # Use any image that provides util-linux and xfsprogs.
          image: 192.168.66.2:5000/nfs-sidecar:latest
          imagePullPolicy: Always
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail

              # Locate the pool block device by its fixed serial.
              DEVICE=$(readlink -f /dev/disk/by-id/*${POOL_DV_SERIAL}* 2>/dev/null | head -1)
              if [ -z "$DEVICE" ]; then
                echo "ERROR: no device found for serial '${POOL_DV_SERIAL}' in /dev/disk/by-id/" >&2
                exit 1
              fi
              echo "Found pool device: $DEVICE"

              # Format with XFS on first use only.
              if ! blkid -s TYPE "$DEVICE" | grep -q xfs; then
                echo "No filesystem detected — formatting $DEVICE with XFS"
                mkfs.xfs -f "$DEVICE"
              fi

              # Mount the pool device if it isn't already. We check for the
              # specific device rather than using mountpoint(1), because the
              # hostPath bind mount makes /mnt/pool look like a mountpoint
              # even when the pool device itself is not mounted.
              if findmnt -n -o SOURCE --target /mnt/pool | grep -qF "$DEVICE"; then
                echo "$DEVICE already mounted at /mnt/pool — skipping"
              else
                mount "$DEVICE" /mnt/pool
                echo "Mounted $DEVICE at /mnt/pool"
              fi

              # Create directory structure on first use; existing dirs are a no-op.
              mkdir -p /mnt/pool/.ganesha-state/v4recov
              mkdir -p /mnt/pool/export

              # Create an empty exports.conf if this is the first run.
              # On recovery the file already exists on the pool device.
              touch /mnt/pool/.ganesha-state/exports.conf

              cp /tmp/ganesha-template/ganesha.conf /etc/ganesha/ganesha.conf
          securityContext:
            privileged: true
          env:
            - name: POOL_DV_SERIAL
              value: "nfs-pool"
          volumeMounts:
            - name: dev
              mountPath: /dev
            - name: pool-mount
              mountPath: /mnt/pool
              mountPropagation: Bidirectional
            - name: ganesha-conf-dir
              mountPath: /etc/ganesha
            - name: ganesha-config-template
              mountPath: /tmp/ganesha-template
              readOnly: true
          resources:
            requests:
              memory: 20Mi
              cpu: 10m

      containers:
        - name: nfs-ganesha
          # Replace with your preferred NFS-Ganesha image (v3+ required for
          # v4recov recovery backend and NFSv4.1 support).
          image: 192.168.66.2:5000/nfs-ganesha:latest
          imagePullPolicy: Always
          securityContext:
            privileged: true
            capabilities:
              add: ["SYS_ADMIN", "DAC_READ_SEARCH", "SETPCAP"]
          volumeMounts:
            - name: ganesha-conf-dir
              mountPath: /etc/ganesha
            - name: pool-mount
              mountPath: /mnt/pool
              mountPropagation: HostToContainer
            - name: run-ganesha
              mountPath: /var/run/ganesha
            - name: ganesha-state
              mountPath: /var/lib/nfs/ganesha
          ports:
            - name: nfs
              containerPort: 2049
              protocol: TCP
          resources:
            requests:
              memory: 100Mi
              cpu: 50m

        - name: control-sidecar
          image: 192.168.66.2:5000/nfs-sidecar:latest
          imagePullPolicy: Always
          command: ["/nfs-sidecar", "--listen-addr=:9090"]
          securityContext:
            privileged: true
          env:
            - name: POOL_MOUNT_PATH
              value: /mnt/pool
            - name: KUBE_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: pool-mount
              mountPath: /mnt/pool
              mountPropagation: Bidirectional
            - name: run-ganesha
              mountPath: /var/run/ganesha
          ports:
            - name: grpc
              containerPort: 9090
              protocol: TCP
          resources:
            requests:
              memory: 50Mi
              cpu: 10m

      volumes:
        - name: dev
          hostPath:
            path: /dev
            type: Directory
        # Bidirectional propagation on the host-side volume ensures that mounts
        # created by the init container (pool device at /mnt/pool) are visible
        # to both the ganesha and sidecar containers, and that any sub-mounts
        # the sidecar creates later propagate back to the host.
        - name: pool-mount
          hostPath:
            path: /mnt/pool
            type: DirectoryOrCreate
        # ganesha-conf-dir is a shared writable directory. The init container
        # renders the final ganesha.conf (with Node_Base substituted) into it
        # from the ConfigMap template. Ganesha reads from this directory, not
        # directly from the ConfigMap.
        - name: ganesha-conf-dir
          hostPath:
            path: /etc/ganesha
            type: DirectoryOrCreate
        - name: ganesha-config-template
          configMap:
            name: ganesha-config
        - name: run-ganesha
          hostPath:
            path: /var/run/ganesha
            type: DirectoryOrCreate
        - name: ganesha-state
          hostPath:
            path: /mnt/pool/.ganesha-state
            type: DirectoryOrCreate
